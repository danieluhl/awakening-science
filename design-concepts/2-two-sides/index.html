<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unbound · Two Sides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300;1,9..144,400&family=JetBrains+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<script src="../data.js"></script>
<style>
:root{
  --warm-bg:#1b0f09; --warm-1:#f4d9b8; --warm-2:#c99a6b; --warm-3:#7b5638; --ember:#ff8a3d;
  --cool-bg:#05090f; --cool-1:#d6ecff; --cool-2:#7fa6c8; --cool-3:#3b5670; --signal:#56f0d0; --signal-2:#8b8cff; --warn:#ffcc66;
  --split:50%;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#000;color:#fff;overflow:hidden;font-family:'Fraunces',serif}
header{position:fixed;top:0;left:0;right:0;height:58px;z-index:20;display:flex;align-items:center;gap:20px;padding:0 20px;
  background:linear-gradient(90deg,rgba(27,15,9,.9) 0 var(--split),rgba(5,9,15,.9) var(--split));backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.07)}
.brand{font-weight:500;font-size:18px;letter-spacing:.02em;color:var(--warm-1);white-space:nowrap}
.brand em{font-style:italic;color:var(--warm-2);font-weight:300}
.channels{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
.channels button{font-family:'JetBrains Mono';font-size:11px;background:transparent;color:var(--cool-2);border:1px solid rgba(127,166,200,.25);padding:7px 10px;border-radius:3px;cursor:pointer;white-space:nowrap;transition:.25s}
.channels button:hover{color:#fff;border-color:var(--cool-2)}
.channels button[aria-current=true]{background:var(--signal);color:#021;border-color:var(--signal)}
.limits-btn{font-family:'JetBrains Mono';font-size:11px;background:none;border:1px solid var(--warn);color:var(--warn);padding:7px 10px;border-radius:3px;cursor:pointer;white-space:nowrap}

main{position:fixed;top:58px;bottom:120px;left:0;right:0}
.side{position:absolute;top:0;bottom:0;overflow-y:auto;overflow-x:hidden}
.inside{left:0;width:var(--split);background:radial-gradient(ellipse at 30% 30%,#3a1d0e 0%,var(--warm-bg) 60%);color:var(--warm-1)}
.behind{right:0;width:calc(100% - var(--split));background:var(--cool-bg);color:var(--cool-1);font-family:'JetBrains Mono'}
.behind::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(86,240,208,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(86,240,208,.05) 1px,transparent 1px);background-size:32px 32px}
.pad{padding:56px clamp(20px,5vw,70px) 60px;min-width:300px}
.label{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.25em;text-transform:uppercase}
.inside .label{color:var(--warm-2)}.behind .label{color:var(--signal)}
.inside h1{font-weight:300;font-size:clamp(40px,5.4vw,84px);line-height:1;letter-spacing:-.02em;margin:18px 0 10px}
.inside h1 i{font-weight:300;color:var(--ember)}
.inside .sub{font-style:italic;color:var(--warm-2);font-size:20px}
.inside .desc{font-size:20px;line-height:1.55;margin:30px 0;max-width:36ch;color:#ecd3b4}
.bigq{font-style:italic;font-weight:300;font-size:clamp(22px,2.2vw,30px);line-height:1.4;margin:34px 0 8px;max-width:30ch;position:relative}
.bigq::before{content:"“";position:absolute;left:-.55em;top:-.12em;font-size:2.4em;color:var(--ember);opacity:.6;line-height:1}
.cite{font-family:'JetBrains Mono';font-size:11px;color:var(--warm-3);letter-spacing:.06em}
.glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,138,61,.22),transparent 65%);left:-120px;bottom:-140px;pointer-events:none;animation:breathe 8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.25);opacity:.6}}
.try{margin-top:44px;padding:22px 24px;border:1px solid rgba(244,217,184,.2);border-radius:14px;max-width:44ch;background:rgba(255,138,61,.05)}
.try b{display:block;font-weight:500;font-size:19px;margin:6px 0}
.try p{color:#e8cba8;line-height:1.5}

.scope{position:relative;height:260px;border:1px solid rgba(86,240,208,.25);border-radius:6px;margin:22px 0 10px;background:rgba(0,0,0,.4);overflow:hidden}
.scope canvas{width:100%;height:100%;display:block}
.scope .legend{position:absolute;left:12px;top:10px;font-size:10px;line-height:1.7;color:var(--cool-2)}
.scope .legend span{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.scope .phase{position:absolute;right:12px;bottom:10px;font-size:10px;color:var(--cool-2);text-align:right}
.scope .phase b{color:var(--signal);font-weight:600}
.scope .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--signal)}
.behind h2{font-size:15px;font-weight:400;line-height:1.7;color:var(--cool-1);margin:26px 0 22px;max-width:60ch}
.regions{display:grid;gap:8px;margin:20px 0 26px}
.region{display:grid;grid-template-columns:10px 1fr;gap:12px;align-items:start;font-size:12px;line-height:1.5}
.region i{width:10px;height:10px;border-radius:50%;margin-top:4px;background:var(--signal);box-shadow:0 0 12px var(--signal)}
.region b{color:#fff;font-weight:600}.region span{color:var(--cool-2)}
.finding{border-left:1px solid var(--cool-3);padding:4px 0 4px 16px;margin:14px 0;font-size:12.5px;line-height:1.65;color:#bcd4ea}
.finding .src{display:inline-block;margin-top:6px;font-size:10px;color:var(--signal-2);letter-spacing:.06em}
.caveat{margin-top:30px;font-size:11px;color:var(--warn);line-height:1.6;border:1px dashed rgba(255,204,102,.4);padding:12px 14px;border-radius:4px}

.seam{position:absolute;top:0;bottom:0;left:var(--split);width:0;z-index:10}
.seam::before{content:"";position:absolute;top:0;bottom:0;left:-1px;width:2px;background:linear-gradient(var(--ember),#fff,var(--signal));box-shadow:0 0 20px rgba(255,255,255,.4)}
.handle{position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:150px;padding:10px 0;border-radius:40px;background:#fff;color:#111;font-family:'JetBrains Mono';font-size:10px;letter-spacing:.12em;text-align:center;cursor:ew-resize;user-select:none;box-shadow:0 10px 40px rgba(0,0,0,.6);touch-action:none;text-transform:uppercase}
.handle small{display:block;font-family:'Fraunces';font-style:italic;letter-spacing:0;text-transform:none;font-size:12px;color:#555}

.ancestor{position:fixed;left:0;right:0;bottom:0;height:120px;z-index:15;display:flex;align-items:center;gap:30px;padding:0 24px;
  background:#0d0d0c;border-top:1px solid rgba(255,255,255,.1)}
.ancestor .who{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.2em;color:#999;text-transform:uppercase;white-space:nowrap;line-height:1.8}
.ancestor .who b{display:block;color:#e8e2d4;font-size:22px;font-family:'Fraunces';letter-spacing:0;text-transform:none;font-weight:300}
.ancestor .track{flex:1;overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ancestor .roll{display:flex;gap:80px;white-space:nowrap;animation:roll 70s linear infinite;width:max-content}
.ancestor:hover .roll{animation-play-state:paused}
.ancestor .roll p{font-style:italic;font-weight:300;font-size:20px;color:#e8e2d4}
.ancestor .roll p small{font-style:normal;font-family:'JetBrains Mono';font-size:10px;color:#888;margin-left:14px;letter-spacing:.08em}
@keyframes roll{to{transform:translateX(-50%)}}

.drawer{position:fixed;top:58px;right:0;bottom:120px;width:min(440px,100%);background:#120f05;border-left:1px solid var(--warn);z-index:30;transform:translateX(100%);transition:transform .5s cubic-bezier(.7,0,.2,1);overflow-y:auto;padding:36px 30px;font-family:'JetBrains Mono';color:#f5e6c4}
.drawer.open{transform:none}
.drawer h3{font-family:'Fraunces';font-weight:300;font-size:30px;margin-bottom:20px}
.drawer div{margin:18px 0;font-size:12px;line-height:1.6;color:#d9c79e}
.drawer div b{display:block;color:var(--warn);font-weight:600;margin-bottom:4px}
.drawer .bl{font-family:'Fraunces';font-style:italic;font-size:19px;color:#fff;border-top:1px solid #443;padding-top:20px}

.fade{animation:fade .7s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (max-width:820px){
  body{overflow:auto}
  header{position:sticky;flex-wrap:wrap;height:auto;padding:12px 16px;background:#05090f}
  main{position:static}
  .side{position:static;width:100%!important;overflow:visible}
  .seam{display:none}
  .ancestor{position:static;height:auto;flex-direction:column;align-items:flex-start;padding:24px 16px}
  .drawer{top:0;bottom:0}
}
</style>
</head>
<body>
<header>
  <div class="brand">Unbound <em>— one territory, two sides</em></div>
  <nav class="channels" id="channels" aria-label="Experiences"></nav>
  <button class="limits-btn" id="limitsBtn">⚠ Honest limits</button>
</header>

<main id="main">
  <section class="side inside" aria-label="Inside: first-person"><div class="glow"></div><div class="pad" id="inside"></div></section>
  <section class="side behind" aria-label="Behind the scenes: neuroscience"><div class="pad" id="behind"></div></section>
  <div class="seam"><div class="handle" id="handle" role="slider" aria-label="Move the seam between inside and behind" tabindex="0" aria-valuemin="15" aria-valuemax="85" aria-valuenow="50">⟵ drag ⟶<small>Neither side owns it</small></div></div>
</main>

<footer class="ancestor">
  <div class="who">The ancestor · 1200–1253<b>Dōgen Zenji</b></div>
  <div class="track"><div class="roll" id="roll"></div></div>
</footer>

<aside class="drawer" id="drawer" aria-label="Honest limits"></aside>

<script>
const S = window.SITE, X = S.experiences;
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur = 0;

// per-experience instruments: what the oscilloscope shows
const SCOPES = {
  'no-one-home':      {legend:[['Default mode network (PCC)', '#56f0d0'],['Sensory cortex','#8b8cff']], from:'mind-wandering', to:'deep meditation'},
  'the-wall-comes-down':{legend:[['Intrinsic network (self)','#ff8a3d'],['Extrinsic network (world)','#56f0d0']], from:'anticorrelated', to:'both active'},
  'no-edges':         {legend:[['High-beta 21–30 Hz · right TPJ','#56f0d0'],['Self-boundary','#ff8a3d']], from:'bounded', to:'full dissolution'},
  'the-eternal-now':  {legend:[['Metronome timing (unchanged)','#8b8cff'],['Felt passage of time','#56f0d0']], from:'ordinary time', to:'timeless'},
  'more-real-than-real':{legend:[['Prestimulus alpha (the gate)','#8b8cff'],['Sensory signal precision','#56f0d0']], from:'heavy priors', to:'open gate'},
  'effortless-being': {legend:[['PCC activity','#56f0d0'],['Reported effort','#ff8a3d']], from:'striving', to:'effortless'},
  'the-ground-of-being':{legend:[['Broadband signal','#56f0d0'],['Lempel-Ziv complexity','#ff8a3d']], from:'differentiated', to:'de-differentiated'},
  'the-click':        {legend:[['Gamma · ACC / precuneus','#56f0d0'],['?? the click itself','#ffcc66']], from:'searching', to:'recognition'}
};

// channels
const ch = document.getElementById('channels');
ch.innerHTML = X.map((e,i)=>`<button data-i="${i}">${String(i+1).padStart(2,'0')} ${esc(e.title)}</button>`).join('');
ch.onclick = e => { const b=e.target.closest('button'); if(b) show(+b.dataset.i); };
addEventListener('keydown',e=>{ if(e.target===handle) return; if(e.key==='ArrowRight') show((cur+1)%8); if(e.key==='ArrowLeft') show((cur+7)%8); });

function titleHTML(t){ const w=t.split(' '); const last=w.pop(); return esc(w.join(' '))+' <i>'+esc(last)+'</i>'; }

function show(i){
  cur=i; const e=X[i]; const sc=SCOPES[e.id];
  [...ch.children].forEach((b,j)=>b.setAttribute('aria-current',j===i));
  ch.children[i].scrollIntoView({inline:'nearest',block:'nearest'});
  const q = e.first_person.quotes;
  document.getElementById('inside').innerHTML = `<div class="fade">
    <span class="label">Inside · first person · ${String(i+1).padStart(2,'0')}/08</span>
    <h1>${titleHTML(e.title)}</h1><p class="sub">${esc(e.subtitle)}</p>
    <p class="desc">${esc(e.first_person.description)}</p>
    ${q.map(x=>`<p class="bigq">${esc(x.text)}</p><p class="cite">${esc(x.by).toUpperCase()} · ${esc(x.source)}</p>`).join('')}
    <div class="try"><span class="label">Try it</span><b>${esc(e.practice.title)}</b><p>${esc(e.practice.instruction)}</p></div>
  </div>`;
  const regions = (S.experience_brain_region_links.find(r=>r.experience_id===e.id)||{regions:[]}).regions;
  document.getElementById('behind').innerHTML = `<div class="fade">
    <span class="label">Behind the scenes · instrument ${String(i+1).padStart(2,'0')}</span>
    <div class="scope"><canvas id="cv"></canvas>
      <div class="legend">${sc.legend.map(([n,c])=>`<div><span style="background:${c}"></span>${esc(n)}</div>`).join('')}</div>
      <div class="phase" id="phase"></div><div class="bar" id="bar"></div></div>
    <p class="cite" style="color:#3b5670">Illustrative schematic of the reported direction of effect. Not recorded data.</p>
    <h2>${esc(e.science.summary)}</h2>
    <div class="regions">${regions.map(r=>`<div class="region"><i></i><div><b>${esc(r.name)}</b><br><span>${esc(r.role)}</span></div></div>`).join('')}</div>
    ${e.science.findings.map(f=>`<div class="finding">${esc(f.text)}<br><span class="src">↳ ${esc(f.source)}</span></div>`).join('')}
    <div class="caveat">⚠ Correlation, not causation. Nothing here shows a brain region produces this experience. The reports and the data point at the same territory from opposite sides.</div>
  </div>`;
  const dq = e.dogen.quotes;
  const items = dq.map(x=>`<p>“${esc(x.text)}”<small>${esc(x.work).toUpperCase()} · TRANS. ${esc(x.translator).toUpperCase()}</small></p>`).join('');
  document.getElementById('roll').innerHTML = items + items;
  setupCanvas();
}

// oscilloscope
let cv, ctx, W, H, t0 = performance.now();
function setupCanvas(){
  cv = document.getElementById('cv'); ctx = cv.getContext('2d');
  const r = cv.getBoundingClientRect(), d = devicePixelRatio||1;
  W = r.width; H = r.height; cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0); t0 = performance.now();
}
addEventListener('resize',()=>cv&&setupCanvas());
const noise = (x,s=1) => (Math.sin(x*12.9898+s*78.233)*43758.5453)%1;
function line(fn,color,width=1.6,glow=10){
  ctx.beginPath();
  for(let x=0;x<=W;x+=2){ const y=fn(x); x?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.strokeStyle=color; ctx.lineWidth=width; ctx.shadowColor=color; ctx.shadowBlur=glow; ctx.stroke(); ctx.shadowBlur=0;
}
function frame(now){
  requestAnimationFrame(frame);
  if(!ctx) return;
  const T=(now-t0)/1000, cycle=12, ph=(T%cycle)/cycle;
  // phase: 0-.25 ordinary, .25-.6 transition, .6-1 state
  const p = Math.min(1,Math.max(0,(ph-.2)/.4)), ease = p*p*(3-2*p);
  ctx.clearRect(0,0,W,H);
  // grid midline
  ctx.strokeStyle='rgba(86,240,208,.12)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();
  const id = X[cur].id, sc = SCOPES[id], m = H/2, s = T*2;
  const mix = x => { const xp = x/W; return Math.min(1,Math.max(0,ease*1.6 - (1-xp)*.6)); }; // newer samples on right reach the state first
  if(id==='no-one-home'){
    line(x=>{const k=mix(x);return m-40+Math.sin(x*.05+s)*(46*(1-k)+5)+Math.sin(x*.13+s*1.7)*12*(1-k)+k*70},'#56f0d0');
    line(x=>{const k=mix(x);return m+50+Math.sin(x*.09+s*1.3)*(10+18*k)},'#8b8cff',1.2,6);
  } else if(id==='the-wall-comes-down'){
    line(x=>{const k=mix(x);return m-30+Math.sin(x*.04+s)*40},'#ff8a3d');
    line(x=>{const k=mix(x);return m+30+Math.sin(x*.04+s+Math.PI*(1-k))*40},'#56f0d0');
  } else if(id==='no-edges'){
    line(x=>{const k=mix(x);const a=34*(1-k*.9);return m-20+Math.sin(x*.55+s*5)*a*(.7+.3*Math.sin(x*.03))},'#56f0d0',1.2);
    line(x=>{const k=mix(x);return m+70-(1-k)*40},'#ff8a3d',2,12);
  } else if(id==='the-eternal-now'){
    for(let x=((s*40)%60);x<W;x+=60){ ctx.fillStyle='#8b8cff'; ctx.fillRect(x,m+40,2,24); }
    let acc=0; line(x=>{const k=mix(x);return m-30+Math.sin(x*(.02+.06*k)+s*(1+3*k))*30},'#56f0d0');
  } else if(id==='more-real-than-real'){
    line(x=>{const k=mix(x);return m-40+Math.sin(x*.12+s*3)*(28*(1-k*.75))},'#8b8cff');
    line(x=>{const k=mix(x);return m+40+Math.sin(x*.05+s)*16+(noise(x+Math.floor(s*8))-.5)*4*(1-k)+Math.sin(x*.6+s*4)*7*k},'#56f0d0',1.4);
  } else if(id==='effortless-being'){
    line(x=>{const k=mix(x);return m-30+Math.sin(x*.05+s)*(30*(1-k))+k*40},'#56f0d0');
    line(x=>{const k=mix(x);return m+60-(1-k)*50+Math.abs(Math.sin(x*.2+s*3))*14*(1-k)},'#ff8a3d',1.6,8);
  } else if(id==='the-ground-of-being'){
    line(x=>{const k=mix(x);const reg=Math.sin(x*.08+s*2)*30;const irr=(noise(x*.37+Math.floor(s*12),3)-.5)*70;return m-20+reg*(1-k)+irr*k},'#56f0d0',1.3);
    line(x=>{const k=mix(x);return m+80-k*60},'#ff8a3d',2,12);
  } else if(id==='the-click'){
    line(x=>{const k=mix(x);return m-10+Math.sin(x*.9+s*9)*(4+26*k)*(.5+.5*Math.sin(x*.02+s))},'#56f0d0',1.1);
    ctx.setLineDash([4,6]); line(x=>m+80,'#ffcc66',1,0); ctx.setLineDash([]);
    ctx.fillStyle='#ffcc66'; ctx.font='10px JetBrains Mono'; ctx.fillText('no lab has captured this moment',W-210,m+72);
  }
  document.getElementById('phase').innerHTML = `${esc(sc.from)} → <b>${esc(sc.to)}</b><br>${Math.round(ease*100)}%`;
  document.getElementById('bar').style.width = (ph*100)+'%';
}
requestAnimationFrame(frame);

// seam drag
const handle = document.getElementById('handle'), root = document.documentElement;
let split = 50;
function setSplit(v){ split=Math.max(15,Math.min(85,v)); root.style.setProperty('--split',split+'%'); handle.setAttribute('aria-valuenow',Math.round(split)); }
handle.addEventListener('pointerdown',e=>{ handle.setPointerCapture(e.pointerId);
  const mv=ev=>{ setSplit(ev.clientX/innerWidth*100) }, up=()=>{ removeEventListener('pointermove',mv); removeEventListener('pointerup',up); setupCanvas(); };
  addEventListener('pointermove',mv); addEventListener('pointerup',up); });
handle.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'){setSplit(split-5);setupCanvas()} if(e.key==='ArrowRight'){setSplit(split+5);setupCanvas()} });
handle.addEventListener('dblclick',()=>{setSplit(50);setupCanvas()});

// limits
const drawer=document.getElementById('drawer');
drawer.innerHTML = `<h3>What the science doesn't show</h3>${S.limits.map(([t,d])=>`<div><b>${esc(t)}</b>${esc(d)}</div>`).join('')}<p class="bl">${esc(S.bottom_line)}</p>`;
document.getElementById('limitsBtn').onclick=()=>drawer.classList.toggle('open');

show(0);
</script>
</body>
</html>
